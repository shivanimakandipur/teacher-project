<!-- Script to load JSON data and enable smart multi-language search -->
  <script>
    let allOrders = [];

    // JSON फाइल को सुरक्षित तरीके से लोड करना
    fetch('orders.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        allOrders = data;
        displayTable(allOrders);
      })
      .catch(error => {
        console.error('Error loading orders:', error);
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="3" class="p-6 text-center text-red-500 font-medium">शासनादेश लोड करने में समस्या आई। कृपया सुनिश्चित करें कि orders.json फाइल सही जगह पर है।</td></tr>`;
      });

    function displayTable(orders) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      if(!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-500">कोई शासनादेश उपलब्ध नहीं है।</td></tr>`;
        return;
      }

      orders.forEach(order => {
        let tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="p-3.5 sm:p-4 font-medium whitespace-nowrap text-slate-600">${order.date}</td>
          <td class="p-3.5 sm:p-4 font-semibold text-slate-900">${order.subject}</td>
          <td class="p-3.5 sm:p-4 text-center whitespace-nowrap">
            <div class="flex items-center justify-center gap-2">
              <a href="${order.driveLink}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-sm inline-flex items-center gap-1">👁️ देखें</a>
              <a href="${order.driveLink}" target="_blank" download class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-sm inline-flex items-center gap-1">📥 डाउनलोड</a>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // स्मार्ट मल्टी-लैंग्वेज सर्च फंक्शन (हिंदी और अंग्रेजी दोनों के लिए)
    function filterOrders() {
      let query = document.getElementById('searchOrder').value.toLowerCase().trim();
      
      let filtered = allOrders.filter(order => {
        let subjectText = order.subject.toLowerCase();
        let dateText = order.date.toLowerCase();
        // विषय या दिनांक में से कहीं भी मैच होने पर रिजल्ट दिखाएगा
        return subjectText.includes(query) || dateText.includes(query);
      });
      
      displayTable(filtered);
    }
  </script>
